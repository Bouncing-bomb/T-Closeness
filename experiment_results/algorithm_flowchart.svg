<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1150" viewBox="0 0 1040 1150" role="img"><title>Mondrian with k-anonymity and t-closeness flowchart</title><rect width="100%" height="100%" fill="#f8fafc" /><style>text{font-family:Arial,sans-serif;fill:#334155;font-size:12px}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" /></marker></defs><text x="520" y="30" text-anchor="middle" style="font-size:22px;font-weight:bold">Mondrian + t-closeness</text><rect x="330" y="50" width="380" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" /><text x="520.0" y="79" text-anchor="middle">Input: numeric/encoded QIs, last-column SA</text><text x="520.0" y="97" text-anchor="middle">Valid input: N &gt;= k &gt;= 1; 0 &lt;= t &lt;= 1</text><rect x="330" y="150" width="380" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" /><text x="520.0" y="179" text-anchor="middle">Initialize QI orders, ranges and global SA Q</text><text x="520.0" y="197" text-anchor="middle">Root partition = all records</text><polygon points="520.0,245 710,295 520.0,345 330,295" fill="#dbeafe" stroke="#2563eb" /><text x="520.0" y="289" text-anchor="middle">Any allowed QI dimension left?</text><rect x="330" y="375" width="380" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" /><text x="520.0" y="404" text-anchor="middle">Choose allowed dimension with largest NCP</text><text x="520.0" y="422" text-anchor="middle">Find median; tighten this dimension's bounds</text><polygon points="520.0,475 710,525 520.0,575 330,525" fill="#dbeafe" stroke="#2563eb" /><text x="520.0" y="519" text-anchor="middle">Usable median / distinct QI values?</text><rect x="330" y="610" width="380" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" /><text x="520.0" y="639" text-anchor="middle">Strict: left &lt;= median, right &gt; median</text><text x="520.0" y="657" text-anchor="middle">Relaxed: distribute ties to balance counts</text><polygon points="520.0,710 710,760 520.0,810 330,760" fill="#dbeafe" stroke="#2563eb" /><text x="520.0" y="754" text-anchor="middle">Both child sizes &gt;= k?</text><polygon points="520.0,830 710,880 520.0,930 330,880" fill="#dbeafe" stroke="#2563eb" /><text x="520.0" y="874" text-anchor="middle">Both EMD(child, Q) &lt;= t + 1e-9?</text><rect x="330" y="965" width="380" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" /><text x="520.0" y="994" text-anchor="middle">Accept split; recursively anonymize both children</text><text x="520.0" y="1012" text-anchor="middle">New children start with all dimensions allowed</text><rect x="20" y="575" width="235" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" /><text x="137.5" y="604" text-anchor="middle">Reject current cut</text><text x="137.5" y="622" text-anchor="middle">Set allow[dimension] = 0</text><rect x="780" y="260" width="240" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" /><text x="900.0" y="289" text-anchor="middle">Save parent as terminal partition</text><text x="900.0" y="307" text-anchor="middle">Generalize QIs; output metrics</text><polyline points="520,120 520,150" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="520,220 520,245" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="520,345 520,375" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><text x="532" y="364">Yes</text><polyline points="710,295 780,295" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><text x="737" y="285">No</text><polyline points="520,445 520,475" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="520,575 520,610" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><text x="532" y="595">Yes</text><polyline points="520,680 520,710" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><polyline points="520,810 520,830" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><text x="532" y="825">Yes</text><polyline points="520,930 520,965" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><text x="532" y="950">Yes</text><polyline points="330,525 137,525 137,575" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><text x="235" y="513">No</text><polyline points="330,760 137,760 137,645" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><text x="235" y="748">No</text><polyline points="330,880 80,880 80,645" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><text x="235" y="868">No</text><polyline points="137,575 137,295 330,295" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><text x="144" y="370">Retry same parent</text><polyline points="710,1000 750,1000 750,235 520,235 520,245" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" /><text x="775" y="995">For each child</text><text x="40" y="1090">Retry implementation: strict = continue; relaxed = recursive retry and return.</text><text x="40" y="1115">Categorical SA with unit ground distance: EMD = 0.5 * sum_v |P(v) - Q(v)|.</text></svg>